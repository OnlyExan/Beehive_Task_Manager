<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beehive • Projects</title>

<style>
:root{
  --bg:#000;
  --panel:#0b0b0b;
  --card:#121212;
  --card2:#161616;
  --border:#242424;
  --text:#fff;
  --muted:#bdbdbd;
  --accent:#f7b500;
  --accentSoft: rgba(247,181,0,.18);
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --radius: 16px;
  --danger:#ff6b6b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:var(--bg);
  color:var(--text);
}
a{color:inherit}
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns: 260px 1fr;
}
@media (max-width: 900px){
  .app{grid-template-columns: 1fr}
  .sidebar{display:none}
}
.sidebar{
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:18px 14px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 10px 16px;
}
.logo{
  width:38px;
  height:38px;
  border-radius:14px;
  background: radial-gradient(circle at 30% 30%, #ffd66b, var(--accent));
  display:grid;
  place-items:center;
  color:#1a1300;
  font-weight:900;
}
.brand .name{
  font-weight:800;
}
.nav{
  display:grid;
  gap:8px;
  padding:8px;
}
.nav a{
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:14px;
  color:var(--muted);
  border:1px solid transparent;
}
.nav a:hover{
  background: var(--card);
  border-color: var(--border);
  color: var(--text);
}
.nav a.active{
  background: var(--accentSoft);
  border-color: rgba(247,181,0,.35);
  color: var(--text);
}
.nav .dot{
  width:10px;
  height:10px;
  border-radius:999px;
  background:var(--accent);
  box-shadow: 0 0 0 4px rgba(247,181,0,.12);
}
.main{
  display:grid;
  grid-template-rows: 64px 1fr;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(10px);
  position:sticky;
  top:0;
  gap:12px;
}
.search{
  display:flex;
  align-items:center;
  gap:10px;
  background: var(--card);
  border:1px solid var(--border);
  border-radius: 14px;
  padding:10px 12px;
  width:min(520px, 100%);
}
.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:14px;
}
.actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.btn{
  border:1px solid var(--border);
  background: var(--card);
  color: var(--text);
  padding:10px 12px;
  border-radius: 14px;
  cursor:pointer;
  font-weight:700;
}
.btn:hover{
  border-color: rgba(247,181,0,.35);
}
.btn.primary{
  background: linear-gradient(180deg, #ffd66b, var(--accent));
  border:0;
  color:#1a1300;
}
.btn.danger{
  border-color:var(--danger);
  color:var(--danger);
}
.btn.danger:hover{
  background:rgba(255,107,107,.12);
}
.userpill{
  border:1px solid var(--border);
  background: var(--card);
  padding:10px 12px;
  border-radius: 999px;
  color: var(--muted);
  font-size:13px;
}
.content{
  padding:18px;
}
.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px;
}
.hgroup h1{
  margin:0;
  color:var(--accent);
  font-size:22px;
}
.hgroup p{
  margin:6px 0 0;
  color:var(--muted);
}
.grid{
  display:grid;
  grid-template-columns: 1fr;
  gap:14px;
}
.panel{
  background: var(--card);
  border:1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow:visible;
}
.tablewrap{
  overflow:visible;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width: 1000px;
}
th, td{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:14px;
}
th{
  color: var(--accent);
  font-weight:800;
  background: rgba(255,255,255,.02);
}
td{
  color: var(--muted);
}
tr:hover td{
  background: rgba(255,255,255,.02);
  color: var(--text);
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  border:1px solid rgba(247,181,0,.35);
  background: var(--accentSoft);
  color: var(--accent);
}
.k{
  display:inline-grid;
  place-items:center;
  width:22px;
  height:22px;
  border-radius:8px;
  background: rgba(247,181,0,.18);
  border:1px solid rgba(247,181,0,.35);
  color: var(--accent);
  font-weight:900;
  font-size:12px;
}
.small{
  font-size:12px;
  color: var(--muted);
}
.link{
  color: var(--text);
  text-decoration:none;
  font-weight:800;
}
.link:hover{
  text-decoration:underline;
}
.footer{
  padding:14px 4px 0;
  color: var(--muted);
  font-size:12px;
}

.projectMenu{
  position:relative;
  display:inline-block;
}
.menuBtn{
  background: var(--card2);
  color: var(--text);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:900;
  font-size:16px;
}
.menuBtn:hover{
  border-color: rgba(247,181,0,.35);
}
.menuDropdown{
  position:absolute;
  right:0;
  top:36px;
  min-width:190px;
  background: var(--card2);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow: var(--shadow);
  display:none;
  z-index:9999;
  overflow:hidden;
}
.menuDropdown button{
  width:100%;
  background:transparent;
  border:0;
  color:var(--text);
  padding:10px 12px;
  text-align:left;
  cursor:pointer;
  font-weight:700;
}
.menuDropdown button:hover{
  background:rgba(255,255,255,.06);
}
.menuDropdown .dangerItem{
  color:var(--danger);
}

/* Modal */
.modalBack{
  position:fixed;
  inset:0;
  background: rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:100;
}
.modal{
  width:min(560px, 100%);
  background: var(--card2);
  border:1px solid var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding:16px;
}
.modal h2{
  margin:6px 0 10px;
  color:var(--accent);
}
.formRow{
  display:grid;
  gap:6px;
  margin:10px 0;
}
label{
  color: var(--muted);
  font-size:13px;
}
input, textarea, select{
  width:100%;
  padding:10px 12px;
  border-radius: 14px;
  border:1px solid var(--border);
  background: #0c0c0c;
  color: var(--text);
  outline: none;
}
textarea{
  min-height:90px;
  resize:vertical;
}
.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:12px;
}
.employeeList{
  display:grid;
  gap:8px;
  margin-top:10px;
}
.employeeItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0c0c0c;
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">B</div>
      <div>
        <div class="name">Beehive</div>
        <div class="small">Ticket & Task Management</div>
      </div>
    </div>

    <nav class="nav">
      <a href="dashboard.html"><span class="dot"></span>Dashboard</a>
      <a class="active" href="projects.html"><span class="dot"></span>Projects</a>
      <a href="sprints.html"><span class="dot"></span>Sprints</a>
      <a href="index.html"><span class="dot"></span>Logout</a>
    </nav>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="search" title="Front-end search filters the table">
        🔎 <input id="q" type="text" placeholder="Search projects by name or key (e.g., BEE)" />
      </div>
      <div class="actions">
        <button class="btn" onclick="resetProjects()">Reset Projects</button>
        <button class="btn primary" onclick="openCreateModal(true)">+ Create project</button>
        <div class="userpill">Signed in • Guest</div>
      </div>
    </header>

    <main class="content">
      <div class="header">
        <div class="hgroup">
          <h1>Projects</h1>
          <p>Manage your Beehive projects, employees, and project settings.</p>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="tablewrap">
            <table>
              <thead>
                <tr>
                  <th>Key</th>
                  <th>Project</th>
                  <th>Owner</th>
                  <th>Employees</th>
                  <th>Status</th>
                  <th>Last updated</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </section>
</div>

<!-- Create Project Modal -->
<div id="modalBack" class="modalBack" role="dialog" aria-modal="true">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <h2 style="margin:0;">Create Project</h2>
      <button class="btn" onclick="openCreateModal(false)">Close</button>
    </div>

    <div class="formRow">
      <label for="pname">Project name</label>
      <input id="pname" placeholder="e.g., Beehive Web App" />
    </div>

    <div class="formRow">
      <label for="pkey">Project key 2–6 letters</label>
      <input id="pkey" placeholder="e.g., BEE" maxlength="6" />
    </div>

    <div class="formRow">
      <label for="powner">Owner</label>
      <input id="powner" placeholder="e.g., Nathan" />
    </div>

    <div class="formRow">
      <label for="pstatus">Status</label>
      <select id="pstatus">
        <option>Active</option>
        <option>Planned</option>
        <option>On hold</option>
        <option>Archived</option>
      </select>
    </div>

    <div class="modalActions">
      <button class="btn" onclick="openCreateModal(false)">Cancel</button>
      <button class="btn primary" onclick="createProject()">Create</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsBack" class="modalBack" role="dialog" aria-modal="true">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <h2 id="settingsTitle" style="margin:0;">Project Settings</h2>
      <button class="btn" onclick="closeSettings()">Close</button>
    </div>

    <input id="settingsProjectKey" type="hidden" />

    <div class="formRow">
      <label for="newProjectName">Change project name</label>
      <input id="newProjectName" placeholder="Enter new project name" />
      <button class="btn primary" onclick="changeProjectName()">Save New Name</button>
    </div>

    <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;">

    <div class="formRow">
      <label for="employeeName">Add employee</label>
      <input id="employeeName" placeholder="e.g., Nathan Moore" />
      <button class="btn primary" onclick="addEmployee()">Add Employee</button>
    </div>

    <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;">

    <div class="formRow">
      <label>Remove employee</label>
      <div id="employeeList" class="employeeList"></div>
    </div>

    <div class="modalActions">
      <button class="btn" onclick="closeSettings()">Done</button>
    </div>
  </div>
</div>

<script>
const LS_KEY = "beehive_projects_v1";

function nowStamp(){
  const d = new Date();
  return d.toLocaleString(undefined, {
    year:"numeric",
    month:"short",
    day:"2-digit"
  });
}

function loadProjects(){
  try {
    const projects = JSON.parse(localStorage.getItem(LS_KEY)) || [];

    return projects.map(p => ({
      ...p,
      employees: Array.isArray(p.employees) ? p.employees : []
    }));
  } catch {
    return [];
  }
}

function saveProjects(items){
  localStorage.setItem(LS_KEY, JSON.stringify(items));
}

function render(){
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const rows = document.getElementById("rows");

  const items = loadProjects()
    .filter(p => {
      const employees = Array.isArray(p.employees) ? p.employees.join(" ") : "";
      return (p.name + " " + p.key + " " + p.owner + " " + employees).toLowerCase().includes(q);
    })
    .sort((a,b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));

  rows.innerHTML = items.map(p => `
    <tr>
      <td>
        <span class="badge">
          <span class="k">${escapeHtml(p.key)}</span>
          ${escapeHtml(p.key)}
        </span>
      </td>

      <td>
        <a class="link" href="sprints.html" title="Go to Sprints">
          ${escapeHtml(p.name)}
        </a>
      </td>

      <td>${escapeHtml(p.owner)}</td>

      <td>
        ${
          p.employees && p.employees.length
            ? escapeHtml(p.employees.join(", "))
            : `<span class="small">No employees</span>`
        }
      </td>

      <td>${escapeHtml(p.status)}</td>
      <td>${escapeHtml(p.updatedAt)}</td>

      <td>
        <div class="projectMenu">
          <button class="menuBtn" onclick="toggleProjectMenu(event, '${escapeHtml(p.key)}')">⋯</button>

          <div class="menuDropdown" id="menu-${escapeHtml(p.key)}">
            <button onclick="openSettings('${escapeHtml(p.key)}')">Settings</button>
            <button class="dangerItem" onclick="confirmDeleteProject('${escapeHtml(p.key)}')">Delete</button>
          </div>
        </div>
      </td>
    </tr>
  `).join("");

  if(items.length === 0){
    rows.innerHTML = `
      <tr>
        <td colspan="7" style="color:#bdbdbd;padding:18px;">
          No projects yet. Click <b style="color:#f7b500;">Create project</b> to get started.
        </td>
      </tr>
    `;
  }
}

function openCreateModal(show){
  document.getElementById("modalBack").style.display = show ? "flex" : "none";

  if(show){
    document.getElementById("pname").focus();
  }
}

async function createProject(){
  const name = document.getElementById("pname").value.trim();
  const key = document.getElementById("pkey").value.trim().toUpperCase();
  const owner = document.getElementById("powner").value.trim() || "Unassigned";
  const status = document.getElementById("pstatus").value;

  if(!name){
    alert("Project name is required.");
    return;
  }

  if(key.length < 2){
    alert("Project key should be 2–6 letters.");
    return;
  }

  const items = loadProjects();

  if(items.some(p => p.key === key)){
    alert("That project key already exists.");
    return;
  }

  items.push({
    key,
    name,
    owner,
    employees: [],
    status,
    updatedAt: nowStamp()
  });

  saveProjects(items);

  document.getElementById("pname").value = "";
  document.getElementById("pkey").value = "";
  document.getElementById("powner").value = "";
  document.getElementById("pstatus").value = "Active";

  openCreateModal(false);
  render();

  try{
    const payload = {
      name: name,
      description: `${key} • Owner: ${owner} • Status: ${status}`,
      start_date: null,
      end_date: null,
    };

    const res = await fetch("http://127.0.0.1:8000/projects", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    if(res.ok){
      const project = await res.json();
      console.log("Created project in backend:", project);
    } else {
      console.warn("Project saved locally, but backend create failed.");
    }
  } catch(error){
    console.warn("Project saved locally. Backend not running or unavailable.", error);
  }
}

function toggleProjectMenu(event, key){
  event.stopPropagation();

  document.querySelectorAll(".menuDropdown").forEach(menu => {
    if(menu.id !== `menu-${key}`){
      menu.style.display = "none";
    }
  });

  const menu = document.getElementById(`menu-${key}`);
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function openSettings(key){
  document.querySelectorAll(".menuDropdown").forEach(menu => {
    menu.style.display = "none";
  });

  const projects = loadProjects();
  const project = projects.find(p => p.key === key);

  if(!project){
    alert("Project not found.");
    return;
  }

  document.getElementById("settingsProjectKey").value = key;
  document.getElementById("settingsTitle").textContent = `Settings • ${project.name}`;
  document.getElementById("newProjectName").value = project.name;
  document.getElementById("employeeName").value = "";

  renderEmployeeList(project);

  document.getElementById("settingsBack").style.display = "flex";
}

function closeSettings(){
  document.getElementById("settingsBack").style.display = "none";
}

function changeProjectName(){
  const key = document.getElementById("settingsProjectKey").value;
  const newName = document.getElementById("newProjectName").value.trim();

  if(!newName){
    alert("Project name cannot be empty.");
    return;
  }

  const projects = loadProjects();
  const project = projects.find(p => p.key === key);

  if(!project){
    alert("Project not found.");
    return;
  }

  project.name = newName;
  project.updatedAt = nowStamp();

  saveProjects(projects);
  document.getElementById("settingsTitle").textContent = `Settings • ${project.name}`;
  render();
  alert("Project name updated.");
}

function addEmployee(){
  const key = document.getElementById("settingsProjectKey").value;
  const employeeName = document.getElementById("employeeName").value.trim();

  if(!employeeName){
    alert("Employee name is required.");
    return;
  }

  const projects = loadProjects();
  const project = projects.find(p => p.key === key);

  if(!project){
    alert("Project not found.");
    return;
  }

  if(!Array.isArray(project.employees)){
    project.employees = [];
  }

  const alreadyExists = project.employees.some(emp => {
    return emp.toLowerCase() === employeeName.toLowerCase();
  });

  if(alreadyExists){
    alert("That employee is already on this project.");
    return;
  }

  project.employees.push(employeeName);
  project.updatedAt = nowStamp();

  saveProjects(projects);
  document.getElementById("employeeName").value = "";

  renderEmployeeList(project);
  render();
}

function removeEmployee(employeeName){
  const key = document.getElementById("settingsProjectKey").value;
  const projects = loadProjects();
  const project = projects.find(p => p.key === key);

  if(!project){
    alert("Project not found.");
    return;
  }

  const confirmed = confirm(`Remove ${employeeName} from this project?`);
  if(!confirmed) return;

  project.employees = project.employees.filter(emp => emp !== employeeName);
  project.updatedAt = nowStamp();

  saveProjects(projects);
  renderEmployeeList(project);
  render();
}

function renderEmployeeList(project){
  const employeeList = document.getElementById("employeeList");

  if(!project.employees || project.employees.length === 0){
    employeeList.innerHTML = `<div class="small">No employees assigned to this project.</div>`;
    return;
  }

  employeeList.innerHTML = project.employees.map(emp => `
    <div class="employeeItem">
      <span>${escapeHtml(emp)}</span>
      <button class="btn danger" onclick="removeEmployee('${escapeHtml(emp)}')">Remove</button>
    </div>
  `).join("");
}

function confirmDeleteProject(key){
  document.querySelectorAll(".menuDropdown").forEach(menu => {
    menu.style.display = "none";
  });

  const confirmed = confirm(
    `Are you sure you want to delete this project?\n\nAll tickets/tasks associated with project ${key} will be removed.`
  );

  if(!confirmed) return;

  deleteProject(key);
}

function deleteProject(key){
  let projects = loadProjects();
  projects = projects.filter(p => p.key !== key);
  saveProjects(projects);

  deleteTicketsForProject(key);

  render();
}

function deleteTicketsForProject(projectKey){
  const possibleTicketKeys = [
    "beehive_tickets_v1",
    "beehive_tasks_v1",
    "beehive_sprints_v1",
    "beehive_board_v1"
  ];

  possibleTicketKeys.forEach(storageKey => {
    const raw = localStorage.getItem(storageKey);
    if(!raw) return;

    try{
      const data = JSON.parse(raw);

      if(Array.isArray(data)){
        const filtered = data.filter(item => {
          return item.projectKey !== projectKey &&
                 item.project !== projectKey &&
                 item.key !== projectKey;
        });

        localStorage.setItem(storageKey, JSON.stringify(filtered));
      }

      else if(typeof data === "object" && data !== null){
        Object.keys(data).forEach(groupKey => {
          if(Array.isArray(data[groupKey])){
            data[groupKey] = data[groupKey].filter(item => {
              return item.projectKey !== projectKey &&
                     item.project !== projectKey &&
                     item.key !== projectKey;
            });
          }
        });

        localStorage.setItem(storageKey, JSON.stringify(data));
      }

    } catch(error){
      console.warn(`Could not clean tickets from ${storageKey}`, error);
    }
  });
}

function resetProjects(){
  localStorage.removeItem("beehive_projects_v1");
  render();
}

function escapeHtml(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.getElementById("q").addEventListener("input", render);

document.addEventListener("click", () => {
  document.querySelectorAll(".menuDropdown").forEach(menu => {
    menu.style.display = "none";
  });
});

render();
</script>
</body>
</html>
