<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beehive • Projects</title>

<style>
:root{
  --bg:#000;
  --panel:#0b0b0b;
  --card:#121212;
  --card2:#161616;
  --border:#242424;
  --text:#fff;
  --muted:#bdbdbd;
  --accent:#f7b500;
  --accentSoft: rgba(247,181,0,.18);
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --radius: 16px;
  --danger:#ff6b6b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:var(--bg);
  color:var(--text);
}
a{color:inherit}
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns: 260px 1fr;
}
@media (max-width: 900px){
  .app{grid-template-columns: 1fr}
  .sidebar{display:none}
}
.sidebar{
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:18px 14px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 10px 16px;
}
.logo{
  width:38px;
  height:38px;
  border-radius:14px;
  background: radial-gradient(circle at 30% 30%, #ffd66b, var(--accent));
  display:grid;
  place-items:center;
  color:#1a1300;
  font-weight:900;
}
.brand .name{
  font-weight:800;
  letter-spacing:.2px;
}
.nav{
  display:grid;
  gap:8px;
  padding:8px;
}
.nav a{
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:14px;
  color:var(--muted);
  border:1px solid transparent;
}
.nav a:hover{
  background: var(--card);
  border-color: var(--border);
  color: var(--text);
}
.nav a.active{
  background: var(--accentSoft);
  border-color: rgba(247,181,0,.35);
  color: var(--text);
}
.nav .dot{
  width:10px;
  height:10px;
  border-radius:999px;
  background:var(--accent);
  box-shadow: 0 0 0 4px rgba(247,181,0,.12);
}
.main{
  display:grid;
  grid-template-rows: 64px 1fr;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(10px);
  position:sticky;
  top:0;
  gap:12px;
}
.search{
  display:flex;
  align-items:center;
  gap:10px;
  background: var(--card);
  border:1px solid var(--border);
  border-radius: 14px;
  padding:10px 12px;
  width:min(520px, 100%);
}
.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:14px;
}
.actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.btn{
  border:1px solid var(--border);
  background: var(--card);
  color: var(--text);
  padding:10px 12px;
  border-radius: 14px;
  cursor:pointer;
  font-weight:700;
}
.btn:hover{
  border-color: rgba(247,181,0,.35);
}
.btn.primary{
  background: linear-gradient(180deg, #ffd66b, var(--accent));
  border:0;
  color:#1a1300;
}
.userpill{
  border:1px solid var(--border);
  background: var(--card);
  padding:10px 12px;
  border-radius: 999px;
  color: var(--muted);
  font-size:13px;
}
.content{
  padding:18px;
}
.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px;
}
.hgroup h1{
  margin:0;
  color:var(--accent);
  font-size:22px;
}
.hgroup p{
  margin:6px 0 0;
  color:var(--muted);
}
.grid{
  display:grid;
  grid-template-columns: 1fr;
  gap:14px;
}
.panel{
  background: var(--card);
  border:1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow:hidden;
}
.tablewrap{
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width: 900px;
}
th, td{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:14px;
}
th{
  color: var(--accent);
  font-weight:800;
  background: rgba(255,255,255,.02);
}
td{
  color: var(--muted);
}
tr:hover td{
  background: rgba(255,255,255,.02);
  color: var(--text);
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  border:1px solid rgba(247,181,0,.35);
  background: var(--accentSoft);
  color: var(--accent);
}
.k{
  display:inline-grid;
  place-items:center;
  width:22px;
  height:22px;
  border-radius:8px;
  background: rgba(247,181,0,.18);
  border:1px solid rgba(247,181,0,.35);
  color: var(--accent);
  font-weight:900;
  font-size:12px;
}
.small{
  font-size:12px;
  color: var(--muted);
}
.link{
  color: var(--text);
  text-decoration:none;
  font-weight:800;
}
.link:hover{
  text-decoration:underline;
}
.footer{
  padding:14px 4px 0;
  color: var(--muted);
  font-size:12px;
}
.deleteBtn{
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
}
.deleteBtn:hover{
  background: rgba(255,107,107,.12);
}

/* Modal */
.modalBack{
  position:fixed;
  inset:0;
  background: rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.modal{
  width:min(560px, 100%);
  background: var(--card2);
  border:1px solid var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding:16px;
}
.modal h2{
  margin:6px 0 10px;
  color:var(--accent);
}
.formRow{
  display:grid;
  gap:6px;
  margin:10px 0;
}
label{
  color: var(--muted);
  font-size:13px;
}
input, textarea, select{
  width:100%;
  padding:10px 12px;
  border-radius: 14px;
  border:1px solid var(--border);
  background: #0c0c0c;
  color: var(--text);
  outline: none;
}
textarea{
  min-height:90px;
  resize:vertical;
}
.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:12px;
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">B</div>
      <div>
        <div class="name">Beehive</div>
        <div class="small">Ticket & Task Management</div>
      </div>
    </div>

    <nav class="nav">
      <a href="dashboard.html"><span class="dot"></span>Dashboard</a>
      <a class="active" href="projects.html"><span class="dot"></span>Projects</a>
      <a href="sprints.html"><span class="dot"></span>Sprints</a>
      <a href="index.html"><span class="dot"></span>Logout</a>
    </nav>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="search" title="Front-end search filters the table">
        🔎 <input id="q" type="text" placeholder="Search projects by name or key (e.g., BEE)" />
      </div>
      <div class="actions">
        <button class="btn" onclick="resetProjects()">Reset Projects</button>
        <button class="btn primary" onclick="openModal(true)">+ Create project</button>
        <div class="userpill">Signed in • Guest</div>
      </div>
    </header>

    <main class="content">
      <div class="header">
        <div class="hgroup">
          <h1>Projects</h1>
          <p>Manage your Beehive projects with create and delete actions.</p>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="tablewrap">
            <table>
              <thead>
                <tr>
                  <th>Key</th>
                  <th>Project</th>
                  <th>Owner</th>
                  <th>Status</th>
                  <th>Last updated</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>

        
      </div>
    </main>
  </section>
</div>

<!-- Modal -->
<div id="modalBack" class="modalBack" role="dialog" aria-modal="true" aria-label="Create Project">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <h2 style="margin:0;">Create Project</h2>
      <button class="btn" onclick="openModal(false)">Close</button>
    </div>

    <div class="formRow">
      <label for="pname">Project name</label>
      <input id="pname" placeholder="e.g., Beehive Web App" />
    </div>

    <div class="formRow">
      <label for="pkey">Project key (2–6 letters)</label>
      <input id="pkey" placeholder="e.g., BEE" maxlength="6" />
    </div>

    <div class="formRow">
      <label for="powner">Owner</label>
      <input id="powner" placeholder="e.g., Nathan" />
    </div>

    <div class="formRow">
      <label for="pstatus">Status</label>
      <select id="pstatus">
        <option>Active</option>
        <option>Planned</option>
        <option>On hold</option>
        <option>Archived</option>
      </select>
    </div>

    <div class="modalActions">
      <button class="btn" onclick="openModal(false)">Cancel</button>
      <button class="btn primary" onclick="createProject()">Create</button>
    </div>
  </div>
</div>

<script>
const LS_KEY = "beehive_projects_v1";

function nowStamp(){
  const d = new Date();
  return d.toLocaleString(undefined, {
    year:"numeric",
    month:"short",
    day:"2-digit"
  });
}

function loadProjects(){
  try {
    return JSON.parse(localStorage.getItem(LS_KEY)) || [];
  } catch {
    return [];
  }
}

function saveProjects(items){
  localStorage.setItem(LS_KEY, JSON.stringify(items));
}

function render(){
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const rows = document.getElementById("rows");

  const items = loadProjects()
    .filter(p => (p.name + " " + p.key).toLowerCase().includes(q))
    .sort((a,b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));

  rows.innerHTML = items.map(p => `
    <tr>
      <td>
        <span class="badge">
          <span class="k">${escapeHtml(p.key)}</span>
          ${escapeHtml(p.key)}
        </span>
      </td>
      <td>
        <a class="link" href="sprints.html" title="Go to Sprints">
          ${escapeHtml(p.name)}
        </a>
      </td>
      <td>${escapeHtml(p.owner)}</td>
      <td>${escapeHtml(p.status)}</td>
      <td>${escapeHtml(p.updatedAt)}</td>
      <td>
        <button class="deleteBtn" onclick="deleteProject('${escapeHtml(p.key)}')">
          Delete
        </button>
      </td>
    </tr>
  `).join("");

  if(items.length === 0){
    rows.innerHTML = `
      <tr>
        <td colspan="6" style="color:#bdbdbd;padding:18px;">
          No projects yet. Click <b style="color:#f7b500;">Create project</b> to get started.
        </td>
      </tr>
    `;
  }
}

function openModal(show){
  document.getElementById("modalBack").style.display = show ? "flex" : "none";
  if(show){
    document.getElementById("pname").focus();
  }
}

async function createProject(){
  const name = document.getElementById("pname").value.trim();
  const key = document.getElementById("pkey").value.trim().toUpperCase();
  const owner = document.getElementById("powner").value.trim() || "Unassigned";
  const status = document.getElementById("pstatus").value;

  if(!name){
    alert("Project name is required.");
    return;
  }

  if(key.length < 2){
    alert("Project key should be 2–6 letters.");
    return;
  }

  const items = loadProjects();

  if(items.some(p => p.key === key)){
    alert("That project key already exists.");
    return;
  }

  items.push({
    key,
    name,
    owner,
    status,
    updatedAt: nowStamp()
  });

  saveProjects(items);

  document.getElementById("pname").value = "";
  document.getElementById("pkey").value = "";
  document.getElementById("powner").value = "";
  document.getElementById("pstatus").value = "Active";

  openModal(false);
  render();

  const payload = {
    name: name,
    description: `${key} • Owner: ${owner} • Status: ${status}`, // or leave null and add real fields later
    start_date: null,
    end_date: null,
  };

  const res = await fetch("http://127.0.0.1:8000/projects", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });

  if (res.ok) {
    const project = await res.json();
    alert("Created project: " + project.name);
    openModal(false);    // close modal
    // TODO: update project list UI (or reload)
    // location.reload();
  } else {
    const err = await res.json();
    alert("Error creating project: " + err.detail);
  }
  
}

function deleteProject(key){
  const confirmed = confirm(`Are you sure you want to delete project ${key}?`);
  if(!confirmed) return;

  let items = loadProjects();
  items = items.filter(p => p.key !== key);
  saveProjects(items);
  render();
}

function escapeHtml(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function resetProjects(){
  localStorage.removeItem("beehive_projects_v1");
  render();
}

document.getElementById("q").addEventListener("input", render);

render();
</script>
</body>
</html>
