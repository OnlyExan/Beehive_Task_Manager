<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beehive • Employees</title>

<style>
:root{
  --bg:#000;
  --panel:#0b0b0b;
  --card:#121212;
  --card2:#161616;
  --border:#242424;
  --text:#fff;
  --muted:#bdbdbd;
  --accent:#f7b500;
  --accentSoft: rgba(247,181,0,.18);
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --radius: 16px;
  --danger:#ff6b6b;
  --blue:#66b6ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:var(--bg);
  color:var(--text);
}
a{color:inherit}
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:260px 1fr;
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
}
.sidebar{
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:18px 14px;
}
.brand{display:flex;align-items:center;gap:10px;padding:10px 10px 16px;}
.logo{
  width:38px;height:38px;border-radius:14px;
  background:radial-gradient(circle at 30% 30%, #ffd66b, var(--accent));
  display:grid;place-items:center;color:#1a1300;font-weight:900;
}
.brand .name{font-weight:800;}
.nav{display:grid;gap:8px;padding:8px;}
.nav a{
  text-decoration:none;display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:14px;color:var(--muted);border:1px solid transparent;
}
.nav a:hover{background:var(--card);border-color:var(--border);color:var(--text);}
.nav a.active{background:var(--accentSoft);border-color:rgba(247,181,0,.35);color:var(--text);}
.nav .dot{
  width:10px;height:10px;border-radius:999px;
  background:var(--accent);box-shadow:0 0 0 4px rgba(247,181,0,.12);
}
.demo-banner{
  background:rgba(247,181,0,.12);
  border-bottom:1px solid rgba(247,181,0,.35);
  color:var(--accent);text-align:center;
  padding:8px 16px;font-size:13px;font-weight:700;
}
.main{display:grid;grid-template-rows:auto 64px 1fr;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.55);backdrop-filter:blur(10px);
  position:sticky;top:0;gap:12px;
}
.search{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:10px 12px;width:min(520px,100%);
}
.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;}
.actions{display:flex;align-items:center;gap:10px;}
.btn{
  border:1px solid var(--border);background:var(--card);
  color:var(--text);padding:10px 12px;border-radius:14px;
  cursor:pointer;font-weight:700;
}
.btn:hover{border-color:rgba(247,181,0,.35);}
.btn.primary{background:linear-gradient(180deg,#ffd66b,var(--accent));border:0;color:#1a1300;}
.btn.danger{border-color:var(--danger);color:var(--danger);}
.btn.danger:hover{background:rgba(255,107,107,.12);}
.userpill{
  border:1px solid var(--border);background:var(--card);
  padding:10px 12px;border-radius:999px;color:var(--muted);font-size:13px;
}
.content{padding:18px;}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;}
.hgroup h1{margin:0;color:var(--accent);font-size:22px;}
.hgroup p{margin:6px 0 0;color:var(--muted);}
.grid{display:grid;grid-template-columns:1fr;gap:14px;}
.panel{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:visible;
}
.tablewrap{overflow:visible;}
table{width:100%;border-collapse:collapse;min-width:900px;}
th, td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;font-size:14px;}
th{color:var(--accent);font-weight:800;background:rgba(255,255,255,.02);}
td{color:var(--muted);}
tr:hover td{background:rgba(255,255,255,.02);color:var(--text);}
tr:last-child td{border-bottom:0;}
.small{font-size:12px;color:var(--muted);}
.link{color:var(--text);text-decoration:none;font-weight:800;cursor:pointer;}
.link:hover{text-decoration:underline;}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;
  border:1px solid rgba(247,181,0,.35);background:var(--accentSoft);color:var(--accent);
}
.badge.employee{
  border-color:rgba(102,182,255,.35);
  background:rgba(102,182,255,.14);
  color:var(--blue);
}
.modalBack{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:none;align-items:center;justify-content:center;
  padding:18px;z-index:100;
}
.modal{
  width:min(560px,100%);background:var(--card2);
  border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:16px;
  max-height:90vh;overflow-y:auto;
}
.modal h2{margin:6px 0 10px;color:var(--accent);}
.formRow{display:grid;gap:6px;margin:10px 0;}
label{color:var(--muted);font-size:13px;}
input, textarea, select{
  width:100%;padding:10px 12px;border-radius:14px;
  border:1px solid var(--border);background:#0c0c0c;
  color:var(--text);outline:none;
}
textarea{min-height:90px;resize:vertical;}
.modalActions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;}
.skillsBox{color:var(--muted);line-height:1.7;}
.errorMsg{
  padding:10px 14px;border-radius:10px;
  background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.35);
  color:var(--danger);font-size:13px;margin-bottom:10px;display:none;
}
</style>
</head>

<body>

<script>
// ── DEMO MODE ───────────────────────────────────────────────────────────────
const DEMO_MODE = false;

const DEMO_USER = {
  token: "demo_token",
  id: 1,
  full_name: "Demo Admin",
  role: "admin",
};

if (DEMO_MODE) {
  localStorage.setItem("bh_token", DEMO_USER.token);
  localStorage.setItem("bh_user_id", DEMO_USER.id);
  localStorage.setItem("bh_user_name", DEMO_USER.full_name);
  localStorage.setItem("bh_user_role", DEMO_USER.role);
}

// ── Mock data ────────────────────────────────────────────────────────────────
let mockEmployees = [
  { id: 1, full_name: "Demo Admin", email: "admin@example.com", role: "admin" },
  { id: 2, full_name: "Alice Dev", email: "alice@example.com", role: "employee" },
  { id: 3, full_name: "Bob Tester", email: "bob@example.com", role: "employee" },
  { id: 4, full_name: "Carol Manager", email: "carol@example.com", role: "employee" },
];
let mockNextId = 5;

// Skills only used in demo mode — not wired to API yet
let mockSkills = {
  1: ["Python", "FastAPI"],
  2: ["JavaScript", "React", "CSS"],
  3: ["Selenium", "Pytest"],
  4: ["Lua", "Project Management"],
};

function mockResponse(url, options = {}) {
  const method = (options.method || "GET").toUpperCase();
  const body = options.body ? JSON.parse(options.body) : null;

  // DELETE /employees/{id}
  if (method === "DELETE" && url.match(/\/employees\/\d+$/)) {
    const id = parseInt(url.split("/").pop());
    mockEmployees = mockEmployees.filter(e => e.id !== id);
    delete mockSkills[id];
    return fakeOk({}, 204);
  }

  // PUT /employees/{id}
  if (method === "PUT" && url.match(/\/employees\/\d+$/)) {
    const id = parseInt(url.split("/").pop());
    const idx = mockEmployees.findIndex(e => e.id === id);
    if (idx !== -1) mockEmployees[idx] = { ...mockEmployees[idx], ...body };
    return fakeOk(mockEmployees[idx]);
  }

  // POST /employees
  if (method === "POST" && url.endsWith("/employees")) {
    const newEmp = { id: mockNextId++, ...body };
    mockEmployees.push(newEmp);
    mockSkills[newEmp.id] = [];
    return fakeOk(newEmp, 201);
  }

  // GET /employees
  if (method === "GET" && url.endsWith("/employees")) {
    return fakeOk([...mockEmployees]);
  }

  return fakeOk({});
}

function fakeOk(data, status = 200) {
  return { ok: status < 400, status, json: async () => data };
}
</script>

<div class="demo-banner" id="demo-banner" style="display:none;">
  Demo mode — running without API. Set DEMO_MODE = false to connect to the backend.
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">B</div>
      <div>
        <div class="name">Beehive</div>
        <div class="small">Ticket & Task Management</div>
      </div>
    </div>
    <nav class="nav">
      <a href="dashboard.html"><span class="dot"></span>Dashboard</a>
      <a href="projects.html"><span class="dot"></span>Projects</a>
      <a href="sprints.html"><span class="dot"></span>Sprints</a>
      <a class="active" href="employees.html"><span class="dot"></span>Employees</a>
      <a href="#" onclick="logout()"><span class="dot"></span>Logout</a>
    </nav>
  </aside>

  <section class="main">
    <div class="demo-banner" id="demo-banner-inner" style="display:none;"></div>

    <header class="topbar">
      <div class="search">
        🔎 <input id="q" type="text" placeholder="Search employees by name, email, or role" oninput="filterTable()" />
      </div>
      <div class="actions">
        <button class="btn primary" onclick="openEmployeeModal(true)">+ Add Employee</button>
        <div class="userpill" id="signedInUser">Loading...</div>
      </div>
    </header>

    <main class="content">
      <div class="header">
        <div class="hgroup">
          <h1>Employees</h1>
          <p>Manage team members, roles, emails, and skills.</p>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="tablewrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Skills</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </section>
</div>

<!-- Add/Edit Employee Modal -->
<div id="employeeBack" class="modalBack">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <h2 id="employeeModalTitle" style="margin:0;">Add Employee</h2>
      <button class="btn" onclick="openEmployeeModal(false)">Close</button>
    </div>

    <input id="editingId" type="hidden" />
    <div class="errorMsg" id="empError"></div>

    <div class="formRow">
      <label for="ename">Name</label>
      <input id="ename" placeholder="e.g., John Hernandez" />
    </div>
    <div class="formRow">
      <label for="eemail">Email</label>
      <input id="eemail" placeholder="e.g., john@email.com" />
    </div>
    <div class="formRow">
      <label for="erole">Role</label>
      <select id="erole">
        <option value="employee">Employee</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="formRow" id="passwordRow">
      <label for="epassword">Password</label>
      <input id="epassword" type="password" placeholder="Min. 8 chars, 1 letter, 1 number" />
    </div>
    <div class="formRow">
      <label for="eskills">Skills (comma separated)</label>
      <textarea id="eskills" placeholder="e.g., Python, HTML, JavaScript"></textarea>
    </div>

    <div class="modalActions">
      <button class="btn" onclick="openEmployeeModal(false)">Cancel</button>
      <button class="btn primary" onclick="saveEmployee()">Save</button>
    </div>
  </div>
</div>

<!-- Skills Modal -->
<div id="skillsBack" class="modalBack">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <h2 id="skillsTitle" style="margin:0;">Skills</h2>
      <button class="btn" onclick="closeSkills()">Close</button>
    </div>
    <div id="skillsContent" class="skillsBox"></div>
    <div class="modalActions">
      <button class="btn" onclick="closeSkills()">Done</button>
    </div>
  </div>
</div>

<script>
const API = "http://127.0.0.1:8000";
const token = localStorage.getItem("bh_token");
const userRole = localStorage.getItem("bh_user_role");
const userName = localStorage.getItem("bh_user_name");

// Auth guard
if (!token) window.location.href = "index.html";
if (userRole !== "admin") window.location.href = "dashboard.html";

document.getElementById("signedInUser").textContent = `Signed in • ${userName || "Admin"}`;

// ── API helper ─────────────────────────────────────────────────────────────
async function apiFetch(url, options = {}) {
  const res = await fetch(url, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`,
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) { localStorage.clear(); window.location.href = "index.html"; }
  return res;
}

// ── State ──────────────────────────────────────────────────────────────────
let allEmployees = [];
let allSkills = {};
let editingId = null;

// ── Load employees + skills ────────────────────────────────────────────────
async function loadEmployees() {
  const tbody = document.getElementById("rows");
  try {
    const res = await apiFetch(`${API}/employees`);
    if (!res.ok) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:18px;color:var(--muted);">Failed to load employees.</td></tr>`;
      return;
    }
    allEmployees = await res.json();

    // Fetch skills for all employees in parallel - Joshua
    const skillResults = await Promise.all(
      allEmployees.map(e => apiFetch(`${API}/employees/${e.id}/skills`))
    );
    for (let i = 0; i < allEmployees.length; i++) {
      allSkills[allEmployees[i].id] = skillResults[i].ok
        ? await skillResults[i].json()
        : [];
    }

    render();
  } catch (err) {
    console.error(err);
    tbody.innerHTML = `<tr><td colspan="5" style="padding:18px;color:var(--muted);">Could not connect to the server.</td></tr>`;
  }
}

// ── Render table ───────────────────────────────────────────────────────────
function render() {
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const rows = document.getElementById("rows");

  const filtered = allEmployees.filter(e => {
    const skills = (allSkills[e.id] || []).map(s => s.skill).join(" ");
    return (e.full_name + " " + e.email + " " + e.role + " " + skills)
      .toLowerCase().includes(q);
  });

  if (filtered.length === 0) {
    rows.innerHTML = `
      <tr>
        <td colspan="5" style="color:#bdbdbd;padding:18px;">
          No employees found. Click <b style="color:#f7b500;">Add Employee</b> to get started.
        </td>
      </tr>
    `;
    return;
  }

  rows.innerHTML = filtered.map(e => {
    const skills = (allSkills[e.id] || []).map(s => s.skill).join(", ");
    return `
      <tr>
        <td>
          <span class="link" onclick="showSkills(${e.id})">${escapeHtml(e.full_name)}</span>
        </td>
        <td>${escapeHtml(e.email)}</td>
        <td>
          <span class="badge ${e.role === 'employee' ? 'employee' : ''}">
            ${escapeHtml(e.role.toUpperCase())}
          </span>
        </td>
        <td>
          <span class="small">${escapeHtml(shortSkills(skills))}</span>
        </td>
        <td>
          <button class="btn" onclick="editEmployee(${e.id})">Edit</button>
          <button class="btn danger" onclick="deleteEmployee(${e.id}, '${escapeHtml(e.full_name)}')">Delete</button>
        </td>
      </tr>
    `;
  }).join("");
}

// ── Open / close modal ─────────────────────────────────────────────────────
function openEmployeeModal(show) {
  document.getElementById("employeeBack").style.display = show ? "flex" : "none";
  if (show) {
    editingId = null;
    document.getElementById("employeeModalTitle").textContent = "Add Employee";
    document.getElementById("ename").value = "";
    document.getElementById("eemail").value = "";
    document.getElementById("erole").value = "employee";
    document.getElementById("epassword").value = "";
    document.getElementById("eskills").value = "";
    document.getElementById("passwordRow").style.display = "grid";
    document.getElementById("ename").focus();
  }
}

// ── Edit employee ──────────────────────────────────────────────────────────
function editEmployee(id) {
  const employee = allEmployees.find(e => e.id === id);
  if (!employee) return;

  editingId = id;
  const skills = (allSkills[id] || []).map(s => s.skill).join(", ");

  document.getElementById("employeeModalTitle").textContent = "Edit Employee";
  document.getElementById("ename").value = employee.full_name;
  document.getElementById("eemail").value = employee.email;
  document.getElementById("erole").value = employee.role;
  document.getElementById("epassword").value = "";
  document.getElementById("eskills").value = skills;
  document.getElementById("passwordRow").style.display = "none";
  document.getElementById("employeeBack").style.display = "flex";
}

// ── Save employee ──────────────────────────────────────────────────────────
async function saveEmployee() {
  const name = document.getElementById("ename").value.trim();
  const email = document.getElementById("eemail").value.trim();
  const role = document.getElementById("erole").value;
  const password = document.getElementById("epassword").value;
  const skillsRaw = document.getElementById("eskills").value.trim();
  const isEditing = editingId !== null;

  if (!name || !email) {
    alert("Name and email are required.");
    return;
  }
  if (!isEditing && !password) {
    alert("Password is required for new employees.");
    return;
  }

  try {
    let employeeId;

    if (isEditing) {
      const res = await apiFetch(`${API}/employees/${editingId}`, {
        method: "PUT",
        body: JSON.stringify({ full_name: name, email, role }),
      });
      if (!res.ok) { const d = await res.json(); alert(d.detail || "Failed to update."); return; }
      employeeId = editingId;
    } else {
      const res = await apiFetch(`${API}/employees`, {
        method: "POST",
        body: JSON.stringify({ full_name: name, email, role, password }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.detail || "Failed to create."); return; }
      employeeId = data.id;
    }

    // Sync skills
    const newSkills = skillsRaw.split(",").map(s => s.trim()).filter(Boolean);
    const currentSkills = allSkills[employeeId] || [];
    const currentNames = currentSkills.map(s => s.skill);

    // Add new skills
    for (const skill of newSkills) {
      if (!currentNames.includes(skill)) {
        await apiFetch(`${API}/employees/${employeeId}/skills`, {
          method: "POST",
          body: JSON.stringify({ skill }),
        });
      }
    }

    // Remove deleted skills
    for (const existing of currentSkills) {
      if (!newSkills.includes(existing.skill)) {
        await apiFetch(
          `${API}/employees/${employeeId}/skills/${encodeURIComponent(existing.skill)}`,
          { method: "DELETE" }
        );
      }
    }

    document.getElementById("employeeBack").style.display = "none";
    await loadEmployees();

  } catch (err) {
    console.error(err);
    alert("Could not connect to the server.");
  }
}

// ── Delete employee ────────────────────────────────────────────────────────
async function deleteEmployee(id, name) {
  if (!confirm(`Are you sure you want to delete ${name}?`)) return;
  try {
    const res = await apiFetch(`${API}/employees/${id}`, { method: "DELETE" });
    if (res.ok || res.status === 204) await loadEmployees();
    else { const d = await res.json(); alert(d.detail || "Failed to delete."); }
  } catch { alert("Could not connect to the server."); }
}

// ── Show skills modal ──────────────────────────────────────────────────────
function showSkills(id) {
  const employee = allEmployees.find(e => e.id === id);
  if (!employee) return;

  const skills = (allSkills[id] || []).map(s => s.skill);

  document.getElementById("skillsTitle").textContent = `${employee.full_name}'s Skills`;
  document.getElementById("skillsContent").innerHTML = `
    <p><b>Email:</b> ${escapeHtml(employee.email)}</p>
    <p><b>Role:</b> ${escapeHtml(employee.role.toUpperCase())}</p>
    <p><b>Skills:</b></p>
    ${skills.length > 0
      ? `<ul>${skills.map(s => `<li>${escapeHtml(s)}</li>`).join("")}</ul>`
      : `<p style="color:var(--muted);font-style:italic;">No skills added yet.</p>`
    }
  `;

  document.getElementById("skillsBack").style.display = "flex";
}

function closeSkills() {
  document.getElementById("skillsBack").style.display = "none";
}

// ── Logout ─────────────────────────────────────────────────────────────────
function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}

// ── Helpers ────────────────────────────────────────────────────────────────
function shortSkills(text) {
  return text.length > 45 ? text.slice(0, 45) + "..." : text;
}

function escapeHtml(s) {
  return String(s ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("employeeBack").addEventListener("click", e => {
  if (e.target.id === "employeeBack") openEmployeeModal(false);
});
document.getElementById("skillsBack").addEventListener("click", e => {
  if (e.target.id === "skillsBack") closeSkills();
});

loadEmployees();
</script>
</body>
</html>
