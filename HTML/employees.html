<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beehive • Employees</title>

<style>
:root{
  --bg:#000;
  --panel:#0b0b0b;
  --card:#121212;
  --card2:#161616;
  --border:#242424;
  --text:#fff;
  --muted:#bdbdbd;
  --accent:#f7b500;
  --accentSoft: rgba(247,181,0,.18);
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --radius: 16px;
  --danger:#ff6b6b;
  --blue:#66b6ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{color:inherit}

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:260px 1fr;
}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
}

.sidebar{
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:18px 14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 10px 16px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:14px;
  background:radial-gradient(circle at 30% 30%, #ffd66b, var(--accent));
  display:grid;
  place-items:center;
  color:#1a1300;
  font-weight:900;
}

.brand .name{
  font-weight:800;
}

.nav{
  display:grid;
  gap:8px;
  padding:8px;
}

.nav a{
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:14px;
  color:var(--muted);
  border:1px solid transparent;
}

.nav a:hover{
  background:var(--card);
  border-color:var(--border);
  color:var(--text);
}

.nav a.active{
  background:var(--accentSoft);
  border-color:rgba(247,181,0,.35);
  color:var(--text);
}

.nav .dot{
  width:10px;
  height:10px;
  border-radius:999px;
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(247,181,0,.12);
}

.main{
  display:grid;
  grid-template-rows:64px 1fr;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  gap:12px;
}

.search{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 12px;
  width:min(520px, 100%);
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:14px;
}

.actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 12px;
  border-radius:14px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{
  border-color:rgba(247,181,0,.35);
}

.btn.primary{
  background:linear-gradient(180deg, #ffd66b, var(--accent));
  border:0;
  color:#1a1300;
}

.btn.danger{
  border-color:var(--danger);
  color:var(--danger);
}

.btn.danger:hover{
  background:rgba(255,107,107,.12);
}

.userpill{
  border:1px solid var(--border);
  background:var(--card);
  padding:10px 12px;
  border-radius:999px;
  color:var(--muted);
  font-size:13px;
}

.content{
  padding:18px;
}

.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px;
}

.hgroup h1{
  margin:0;
  color:var(--accent);
  font-size:22px;
}

.hgroup p{
  margin:6px 0 0;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:visible;
}

.tablewrap{
  overflow:visible;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th, td{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:14px;
}

th{
  color:var(--accent);
  font-weight:800;
  background:rgba(255,255,255,.02);
}

td{
  color:var(--muted);
}

tr:hover td{
  background:rgba(255,255,255,.02);
  color:var(--text);
}

.small{
  font-size:12px;
  color:var(--muted);
}

.link{
  color:var(--text);
  text-decoration:none;
  font-weight:800;
  cursor:pointer;
}

.link:hover{
  text-decoration:underline;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  border:1px solid rgba(247,181,0,.35);
  background:var(--accentSoft);
  color:var(--accent);
}

.badge.employee{
  border-color:rgba(102,182,255,.35);
  background:rgba(102,182,255,.14);
  color:var(--blue);
}

/* Modal */
.modalBack{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:100;
}

.modal{
  width:min(560px, 100%);
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:16px;
}

.modal h2{
  margin:6px 0 10px;
  color:var(--accent);
}

.formRow{
  display:grid;
  gap:6px;
  margin:10px 0;
}

label{
  color:var(--muted);
  font-size:13px;
}

input, textarea, select{
  width:100%;
  padding:10px 12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#0c0c0c;
  color:var(--text);
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:12px;
}

.skillsBox{
  color:var(--muted);
  line-height:1.7;
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">B</div>
      <div>
        <div class="name">Beehive</div>
        <div class="small">Ticket & Task Management</div>
      </div>
    </div>

    <nav class="nav">
      <a href="dashboard.html"><span class="dot"></span>Dashboard</a>
      <a href="projects.html"><span class="dot"></span>Projects</a>
      <a href="sprints.html"><span class="dot"></span>Sprints</a>
      <a class="active" href="employees.html"><span class="dot"></span>Employees</a>
      <a href="index.html" onclick="logout()"><span class="dot"></span>Logout</a>
    </nav>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="search">
        🔎 <input id="q" type="text" placeholder="Search employees by name, email, or role" />
      </div>

      <div class="actions">
        <button class="btn primary" onclick="openEmployeeModal(true)">+ Add Employee</button>
        <div class="userpill" id="signedInUser">Signed in • Guest</div>
      </div>
    </header>

    <main class="content">
      <div class="header">
        <div class="hgroup">
          <h1>Employees</h1>
          <p>Manage team members, roles, emails, and skills.</p>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="tablewrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Skills</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </section>
</div>

<!-- Add/Edit Employee Modal -->
<div id="employeeBack" class="modalBack">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <h2 id="employeeModalTitle" style="margin:0;">Add Employee</h2>
      <button class="btn" onclick="openEmployeeModal(false)">Close</button>
    </div>

    <input id="editingIndex" type="hidden" />

    <div class="formRow">
      <label for="ename">Name</label>
      <input id="ename" placeholder="e.g., John Hernandez" />
    </div>

    <div class="formRow">
      <label for="eemail">Email</label>
      <input id="eemail" placeholder="e.g., john@email.com" />
    </div>

    <div class="formRow">
      <label for="erole">Role</label>
      <select id="erole">
        <option value="employee">Employee</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <div class="formRow">
      <label for="eskills">Skills</label>
      <textarea id="eskills" placeholder="e.g., Python, HTML, JavaScript"></textarea>
    </div>

    <div class="modalActions">
      <button class="btn" onclick="openEmployeeModal(false)">Cancel</button>
      <button class="btn primary" onclick="saveEmployee()">Save</button>
    </div>
  </div>
</div>

<!-- Skills Modal -->
<div id="skillsBack" class="modalBack">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <h2 id="skillsTitle" style="margin:0;">Skills</h2>
      <button class="btn" onclick="closeSkills()">Close</button>
    </div>

    <div id="skillsContent" class="skillsBox"></div>

    <div class="modalActions">
      <button class="btn" onclick="closeSkills()">Done</button>
    </div>
  </div>
</div>

<script>
const EMPLOYEE_KEY = "beehive_employees_v1";

function loadEmployees(){
  try{
    return JSON.parse(localStorage.getItem(EMPLOYEE_KEY)) || [];
  }catch{
    return [];
  }
}

function saveEmployees(items){
  localStorage.setItem(EMPLOYEE_KEY, JSON.stringify(items));
}

function render(){
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const rows = document.getElementById("rows");

  const employees = loadEmployees().filter(e => {
    return (e.name + " " + e.email + " " + e.role + " " + e.skills).toLowerCase().includes(q);
  });

  rows.innerHTML = employees.map((e) => {
    const realIndex = loadEmployees().findIndex(emp =>
      emp.name === e.name &&
      emp.email === e.email &&
      emp.role === e.role
    );

    return `
      <tr>
        <td>
          <span class="link" onclick="showSkills(${realIndex})">${escapeHtml(e.name)}</span>
        </td>
        <td>${escapeHtml(e.email)}</td>
        <td>
          <span class="badge ${e.role === "employee" ? "employee" : ""}">
            ${escapeHtml(e.role.toUpperCase())}
          </span>
        </td>
        <td>
          <span class="small">${escapeHtml(shortSkills(e.skills))}</span>
        </td>
        <td>
          <button class="btn" onclick="editEmployee(${realIndex})">Edit</button>
          <button class="btn danger" onclick="deleteEmployee(${realIndex})">Delete</button>
        </td>
      </tr>
    `;
  }).join("");

  if(employees.length === 0){
    rows.innerHTML = `
      <tr>
        <td colspan="5" style="color:#bdbdbd;padding:18px;">
          No employees found. Click <b style="color:#f7b500;">Add Employee</b> to get started.
        </td>
      </tr>
    `;
  }
}

function openEmployeeModal(show){
  document.getElementById("employeeBack").style.display = show ? "flex" : "none";

  if(show){
    document.getElementById("employeeModalTitle").textContent = "Add Employee";
    document.getElementById("editingIndex").value = "";
    document.getElementById("ename").value = "";
    document.getElementById("eemail").value = "";
    document.getElementById("erole").value = "employee";
    document.getElementById("eskills").value = "";
    document.getElementById("ename").focus();
  }
}

function editEmployee(index){
  const employees = loadEmployees();
  const e = employees[index];

  document.getElementById("employeeModalTitle").textContent = "Edit Employee";
  document.getElementById("editingIndex").value = index;
  document.getElementById("ename").value = e.name;
  document.getElementById("eemail").value = e.email;
  document.getElementById("erole").value = e.role;
  document.getElementById("eskills").value = e.skills;

  document.getElementById("employeeBack").style.display = "flex";
}

function saveEmployee(){
  const name = document.getElementById("ename").value.trim();
  const email = document.getElementById("eemail").value.trim();
  const role = document.getElementById("erole").value;
  const skills = document.getElementById("eskills").value.trim();
  const editingIndex = document.getElementById("editingIndex").value;

  if(!name || !email || !skills){
    alert("Please fill out the employee's name, email, and skills.");
    return;
  }

  const employees = loadEmployees();

  const employeeData = {
    name,
    email,
    role,
    skills
  };

  if(editingIndex === ""){
    employees.push(employeeData);
  }else{
    employees[Number(editingIndex)] = employeeData;
  }

  saveEmployees(employees);
  document.getElementById("employeeBack").style.display = "none";
  render();
}

function deleteEmployee(index){
  const employees = loadEmployees();
  const employee = employees[index];

  const confirmed = confirm(`Are you sure you want to delete ${employee.name}?`);
  if(!confirmed) return;

  employees.splice(index, 1);
  saveEmployees(employees);
  render();
}

function showSkills(index){
  const employees = loadEmployees();
  const e = employees[index];

  const skills = String(e.skills || "")
    .split(",")
    .map(skill => skill.trim())
    .filter(Boolean);

  document.getElementById("skillsTitle").textContent = `${e.name}'s Skills`;

  document.getElementById("skillsContent").innerHTML = `
    <p><b>Email:</b> ${escapeHtml(e.email)}</p>
    <p><b>Role:</b> ${escapeHtml(e.role.toUpperCase())}</p>
    <p><b>Skills:</b></p>
    <ul>
      ${skills.map(skill => `<li>${escapeHtml(skill)}</li>`).join("")}
    </ul>
  `;

  document.getElementById("skillsBack").style.display = "flex";
}

function closeSkills(){
  document.getElementById("skillsBack").style.display = "none";
}

function shortSkills(skills){
  const text = String(skills || "");
  return text.length > 45 ? text.slice(0, 45) + "..." : text;
}

function escapeHtml(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function logout(){
  localStorage.removeItem("currentUserName");
  localStorage.removeItem("currentUser");
  localStorage.removeItem("username");
  localStorage.removeItem("loggedInUser");
  localStorage.removeItem("isLoggedIn");
}

const signedInUser =
  localStorage.getItem("currentUserName") ||
  localStorage.getItem("currentUser") ||
  localStorage.getItem("username") ||
  localStorage.getItem("loggedInUser") ||
  "Guest";

document.getElementById("signedInUser").textContent = "Signed in • " + signedInUser;

document.getElementById("q").addEventListener("input", render);
localStorage.removeItem("beehive_employees_v1"); //Clear existing data for demo purposes
render();
</script>
</body>
</html>
