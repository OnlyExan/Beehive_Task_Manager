<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beehive Dashboard</title>

<style>
:root{
  --bg:#000000;
  --card:#111111;
  --text:#ffffff;
  --muted:#cccccc;
  --accent:#f7b500; /* honey yellow */
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* Top Navigation */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 28px;
  background:#0a0a0a;
  border-bottom:1px solid #222;
}

nav h1{
  margin:0;
  font-size:20px;
  color: var(--accent);
}

nav a.logout{
  background: var(--accent);
  color:#1a1300;
  text-decoration:none;
  padding:8px 14px;
  border-radius:8px;
  font-weight:700;
}

nav a.logout:hover{opacity:.9}

/* Main Layout */
.container{
  padding:40px;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:30px;
}

/* Cards */
.card{
  display:block;
  background: var(--card);
  padding:30px;
  border-radius:14px;
  border:1px solid #222;
  transition:.2s ease;
  cursor:pointer;
  text-decoration:none;
  color:inherit;
}

.card:hover{
  border-color: var(--accent);
  transform: translateY(-4px);
}

.card h2{
  margin-top:0;
  color: var(--accent);
}

.card p{
  color: var(--muted);
}

.footer{
  text-align:center;
  padding:20px;
  color: var(--muted);
}
</style>
</head>

<body>

<nav>
  <h1>🐝 Beehive</h1>
  <a class="logout" href="index.html">Logout</a>
</nav>

<div class="container">
  <a class="card" href="projects.html">
    <h2>Projects</h2>
    <p>Create, manage, and organize all your active projects.</p>
  </a>

  <a class="card" href="sprints.html">
    <h2>Sprints</h2>
    <p>Plan sprint cycles, assign tickets, and track progress.</p>
  </a>
</div>

<div class="footer">
  © 2026 Beehive Task Management
</div>

</body>
</html>
