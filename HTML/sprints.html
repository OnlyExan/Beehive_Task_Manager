<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beehive • Sprints</title>

<style>
:root{
  --bg:#000;
  --card:#111;
  --text:#fff;
  --muted:#ccc;
  --accent:#f7b500;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:var(--bg);
  color:var(--text);
}
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 28px;
  background:#0a0a0a;
  border-bottom:1px solid #222;
}
nav a{
  color:var(--accent);
  text-decoration:none;
  font-weight:700;
}
nav a:hover{text-decoration:underline}
.container{padding:32px; max-width:1000px; margin:0 auto;}
h1{margin:0 0 6px; color:var(--accent)}
p{margin:0 0 20px; color:var(--muted)}
.card{
  background:var(--card);
  border:1px solid #222;
  border-radius:14px;
  padding:20px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th, td{
  padding:12px;
  border-bottom:1px solid #222;
  text-align:left;
}
th{color:var(--accent)}
td{color:var(--muted)}
.status{
  color:var(--accent);
  font-weight:700;
}
</style>
</head>
<body>

<nav>
  <a href="dashboard.html">← Dashboard</a>
  <a href="login.html">Logout</a>
</nav>

<div class="container">
  <h1>Sprints</h1>
  <p>Plan sprint cycles and track progress.</p>

  <div class="card">
    <h2 style="margin:0 0 10px;">Sprint List (Example)</h2>
    <table>
      <thead>
        <tr>
          <th>Sprint</th>
          <th>Dates</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Sprint 1</td>
          <td>Feb 24 – Mar 9</td>
          <td class="status">Active</td>
        </tr>
        <tr>
          <td>Sprint 2</td>
          <td>Mar 10 – Mar 23</td>
          <td>Planned</td>
        </tr>
        <tr>
          <td>Sprint 3</td>
          <td>Mar 24 – Apr 6</td>
          <td>Planned</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
