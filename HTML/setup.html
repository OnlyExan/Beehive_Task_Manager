<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beehive • Setup</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#111a33;
      --card:#0f1730cc;
      --text:#e9eefc;
      --muted:#b8c4f2;
      --accent:#f7b500;
      --accent2:#ffd66b;
      --danger:#ff5b6e;
      --success:#2ecc71;
      --ring: rgba(247,181,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 600px at 20% 10%, rgba(247,181,0,.20), transparent 60%),
        radial-gradient(900px 600px at 80% 90%, rgba(120,140,255,.20), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:grid;
      place-items:center;
      padding:24px;
    }
    .wrap{
      width:min(480px, 100%);
      display:grid;
      gap:20px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .logo{
      width:44px;
      height:44px;
      border-radius:14px;
      background: radial-gradient(circle at 30% 30%, var(--accent2), var(--accent));
      display:grid;
      place-items:center;
      font-weight:900;
      color:#1a1300;
    }
    .brand h1{margin:0;font-size:20px;}
    .card{
      border-radius:22px;
      background: var(--card);
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      padding:28px;
      backdrop-filter: blur(10px);
    }
    .card h2{margin:0 0 6px;font-size:22px;color:var(--accent);}
    .card p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.6;}
    label{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin:12px 0 6px;
    }
    .field{
      display:flex;
      align-items:center;
      gap:10px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      padding:12px;
    }
    .field input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:15px;
    }
    .field:focus-within{
      border-color: rgba(247,181,0,.55);
      box-shadow: 0 0 0 4px var(--ring);
    }
    .hint{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
    }
    button{
      width:100%;
      margin-top:20px;
      border:0;
      border-radius:14px;
      padding:13px 14px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      background: linear-gradient(180deg, var(--accent2), var(--accent));
      color:#1a1300;
      box-shadow: 0 14px 30px rgba(247,181,0,.20);
    }
    button:hover{filter:brightness(1.02)}
    button:disabled{opacity:.6;cursor:not-allowed;}
    .error{
      margin-top:12px;
      padding:10px 14px;
      border-radius:12px;
      background: rgba(255,91,110,.12);
      border:1px solid rgba(255,91,110,.35);
      color:var(--danger);
      font-size:13px;
      display:none;
    }
    .success{
      margin-top:12px;
      padding:10px 14px;
      border-radius:12px;
      background: rgba(46,204,113,.12);
      border:1px solid rgba(46,204,113,.35);
      color:var(--success);
      font-size:13px;
      display:none;
    }
    .checking{
      text-align:center;
      color:var(--muted);
      font-size:14px;
      padding:40px 0;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">B</div>
      <h1>Beehive</h1>
    </div>

    <!-- Shown while checking setup status -->
    <div class="card" id="checking-card">
      <div class="checking">Checking setup status...</div>
    </div>

    <!-- Shown when setup is needed -->
    <div class="card" id="setup-card" style="display:none;">
      <h2>First time setup</h2>
      <p>
        No accounts exist yet. Create your administrator account below.
        This page will lock itself once setup is complete.
      </p>

      <form id="setup-form">
        <label for="full_name">Full name</label>
        <div class="field">
          <span>👤</span>
          <input id="full_name" type="text" placeholder="e.g. Gabe Gonzalez" required />
        </div>

        <label for="email">Email</label>
        <div class="field">
          <span>📧</span>
          <input id="email" type="email" placeholder="admin@example.com" required />
        </div>

        <label for="password">Password</label>
        <div class="field">
          <span>🔒</span>
          <input id="password" type="password" placeholder="Min. 8 characters" required minlength="8" />
        </div>
        <div class="hint">Must be at least 8 characters and contain a letter and a number.</div>

        <label for="confirm">Confirm password</label>
        <div class="field">
          <span>🔒</span>
          <input id="confirm" type="password" placeholder="Repeat password" required minlength="8" />
        </div>

        <div class="error" id="error-msg"></div>
        <div class="success" id="success-msg"></div>

        <button type="submit" id="submit-btn">Create admin account</button>
      </form>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    // Step 1 — check if setup has already been done
    async function checkSetupStatus() {
      try {
        const res = await fetch(`${API}/setup/status`);
        const data = await res.json();

        if (data.setup_complete) {
          // Setup already done — bounce to login
          window.location.href = "index.html";
          return;
        }

        // Setup needed — show the form
        document.getElementById("checking-card").style.display = "none";
        document.getElementById("setup-card").style.display = "block";

      } catch (err) {
        document.getElementById("checking-card").innerHTML =
          `<div class="checking" style="color:#ff5b6e;">
            Could not connect to the server.<br>Make sure the API is running.
          </div>`;
      }
    }

    checkSetupStatus();

    // Step 2 — handle form submission
    document.getElementById("setup-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = document.getElementById("submit-btn");
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");

      // Reset messages
      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      const fullName = document.getElementById("full_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      // Client side validation
      if (password !== confirm) {
        errorMsg.textContent = "Passwords do not match.";
        errorMsg.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        const res = await fetch(`${API}/setup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            full_name: fullName,
            email: email,
            password: password,
            role: "admin",   // backend forces this anyway but schema requires it
          }),
        });

        const data = await res.json();

        if (res.ok) {
          successMsg.textContent = "Admin account created! Redirecting to login...";
          successMsg.style.display = "block";
          document.getElementById("setup-form").style.display = "none";

          setTimeout(() => {
            window.location.href = "index.html";
          }, 2000);
        } else {
          errorMsg.textContent = data.detail || "Something went wrong. Please try again.";
          errorMsg.style.display = "block";
        }

      } catch (err) {
        errorMsg.textContent = "Could not connect to the server. Is the API running?";
        errorMsg.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Create admin account";
      }
    });
  </script>
</body>
</html>
